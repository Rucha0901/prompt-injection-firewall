spec_version: "0.1.0"
name: prompt-injection-firewall
version: 1.0.0
description: Real-time semantic heuristic firewall that intercepts, tokenizes, and quarantines prompt injection and jailbreak payloads across llm inference streams.
author: "Rucha Salpure"
license: MIT
model:
  preferred: claude-opus-4-6
  fallback:
    - claude-sonnet-4-5-20250929
  constraints:
    temperature: 0.2
    max_tokens: 4096
skills:
  - injection-detection
tools: []
delegation:
  mode: auto
runtime:
  max_turns: 50
  timeout: 300
compliance:
  risk_tier: standard
  frameworks: []
tags:
  - cybersecurity
  - autonomous-agent
  - opengap-verified
metadata:
  repository: "https://github.com/Rucha0901/prompt-injection-firewall"
